name: astrbot_plugin_msg_spoof
display_name: QQ消息伪装
short_desc: 伪装QQ用户消息，以聊天记录转发形式发送
desc: |
  QQ消息伪装插件，支持快捷伪装和详细伪装两种模式，以聊天记录转发（合并转发）形式呈现伪装消息。

  ## 功能特性

  - **快捷伪装**：一条命令快速生成多用户伪装聊天记录
  - **详细伪装**：多轮对话式添加消息，支持随时切换伪装用户
  - **自动获取昵称**：通过API自动获取QQ用户真实昵称
  - **多类型消息**：支持文本、图片、表情等消息类型
  - **黑白名单管理**：支持群黑名单/白名单模式，灵活控制使用范围
  - **超时自动重置**：详细伪装模式30秒无操作自动重置
  - **转发消息呈现**：所有结果以QQ合并转发聊天记录形式发送

  ## 使用方法

  发送 `/伪装消息帮助` 查看完整使用说明。
help: 发送 /伪装消息帮助 查看使用说明。
